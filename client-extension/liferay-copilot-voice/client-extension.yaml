# Liferay custom element client extension descriptor.
#
# The `assets/` dir next to this file is generated by `npm run package`
# (a copy of the runtime files from the repo root — app.js, element.js,
# markup.js, styles.css, config.json, flows.*.json, language/*.properties).
#
# `npm run build:cx` produces the deployable zip: it mirrors this folder into
# liferay-workspace/client-extensions/, runs `gradlew assemble` there, and
# copies the result to dist/liferay-copilot-voice-deployable.zip. That built
# zip is what a bundle's deploy/ dir, LXC and the Marketplace accept.
assemble:
    - from: assets
      into: static

liferay-copilot-voice:
    name: Liferay Copilot Voice
    type: customElement
    description: Voice-driven content creation copilot for Liferay CMS — create web content, blogs, documents and custom Object entries by talking.
    sourceCodeURL: https://github.com/marcoscv-work/liferay-copilot-voice
    htmlElementName: liferay-copilot-voice
    friendlyURLMapping: copilot-voice
    instanceable: false
    portletCategoryName: category.client-extensions
    useESM: false
    # element.js loads app.js itself once the markup is rendered, and the
    # JSON/properties assets resolve against element.js's own URL — so only
    # the two bootstrap scripts are listed here. Order matters: markup.js
    # must run before element.js.
    urls:
        - markup.js
        - element.js
    cssURLs:
        - styles.css
