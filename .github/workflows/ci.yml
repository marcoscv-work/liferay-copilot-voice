name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev dependencies
        run: npm ci
      - name: Syntax check every runtime module
        run: |
          for f in src/*.js element.js markup.js dev-server.js scripts/*.js; do
            node --check "$f"
          done
      - name: Unit + security tests (includes CSS-scope enforcement)
        run: npm test
      - name: Dependency audit (fail on high severity)
        run: npm audit --audit-level=high
      - name: Package the source client extension
        run: npm run package
      - name: Upload source client extension zip
        uses: actions/upload-artifact@v4
        with:
          name: liferay-copilot-voice-source-cx
          path: dist/liferay-copilot-voice.zip
